version: 1
frontend:
  phases:
    preBuild:
      commands:
        - if command -v corepack >/dev/null 2>&1; then corepack enable && corepack prepare pnpm@11.19.0 --activate; else npm install --global pnpm@11.19.0; fi
        - pnpm install --frozen-lockfile
    build:
      commands:
        - printf 'BETTER_AUTH_URL=%s\nCLINICIAN_ADMIN_EMAILS=%s\nGDM_RUNTIME_SECRET_PREFIX=%s\n' "$BETTER_AUTH_URL" "$CLINICIAN_ADMIN_EMAILS" "$GDM_RUNTIME_SECRET_PREFIX" > .env.production
        - pnpm run build
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - .next/cache/**/*
      - node_modules/**/*
