version: 1
frontend:
  phases:
    preBuild:
      commands:
        - if command -v corepack >/dev/null 2>&1; then corepack enable && corepack prepare pnpm@11.19.0 --activate; else npm install --global pnpm@11.19.0; fi
        - pnpm install --frozen-lockfile
    build:
      commands:
        - pnpm run build
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - .next/cache/**/*
      - node_modules/**/*
